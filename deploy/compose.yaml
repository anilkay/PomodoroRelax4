# Same stack as deploy/quadlet, for `podman compose` (or docker compose).
#   cp deploy/pomodoro.env.example deploy/pomodoro.env   # then edit it
#   podman compose -f deploy/compose.yaml up -d --build
# compose.sqlserver.yaml is the same stack on SQL Server.
# Quadlet is the recommended way to run it permanently on a server; see README.

name: pomodoro

services:
  db:
    image: docker.io/library/postgres:18.6
    container_name: pomodoro-db
    env_file: pomodoro.env
    volumes:
      - pomodoro-db:/var/lib/postgresql
    networks:
      default:
        # Matches Host=pomodoro-db in the connection string, as with Quadlet.
        aliases: [pomodoro-db]
    healthcheck:
      # TCP on purpose: the first-time init server listens on the Unix socket only.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432"]
      interval: 10s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  app:
    image: localhost/pomodororelax4:latest
    build:
      context: ..
      dockerfile: Containerfile
    container_name: pomodoro-app
    env_file: pomodoro.env
    volumes:
      - pomodoro-keys:/home/app/.aspnet/DataProtection-Keys
    ports:
      # Only the local reverse proxy should reach the app; it terminates TLS.
      - "127.0.0.1:8082:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Optional Cloudflare Tunnel: `podman compose -f deploy/compose.yaml --profile tunnel up -d`
  # with TUNNEL_TOKEN in deploy/tunnel.env. Public hostname service: http://pomodoro-app:8080.
  tunnel:
    image: docker.io/cloudflare/cloudflared:2026.10.1
    container_name: pomodoro-tunnel
    profiles: [tunnel]
    env_file: tunnel.env
    command: ["tunnel", "--no-autoupdate", "run"]
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pomodoro-db:
  pomodoro-keys:
