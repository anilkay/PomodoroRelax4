# SonarCloud automatic analysis settings.

# Generated files are left out of the duplication measure; they are still analysed otherwise.
# - EF Core migrations: each provider (SQL Server, PostgreSQL) has its own set, and every
#   migration's .Designer.cs repeats the whole model snapshot.
# - tailwind.css: written by the Tailwind CLI at build time.
sonar.cpd.exclusions=**/Migrations/**,**/wwwroot/css/tailwind.css
